name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      # 平台依赖 mooncakes 包（moon-hive）；新版本发布后需先同步 registry 索引，
      # 否则 build 会报 "module was not found in the registry"。
      - name: Sync registry
        run: moon update

      # 平台是 native 编排工具：CLI、编排层、报告层都依赖 MoonHive 的
      # C FFI（进程执行 / 文件系统），只在 native 后端完整可用。
      - name: Build (native)
        run: moon build --target native

      - name: Test (native)
        run: moon test --target native

      # 纯计算模块（jsonparse / report）在 wasm-gc 后端同样全绿，
      # 验证「核心能力跨后端可移植、不依赖宿主 C FFI」的长期可持续性。
      - name: Test (wasm-gc)
        run: moon test --target wasm-gc

      # CLI 冒烟与退出码契约门禁。
      # - doctor 依赖真实外网（git ls-remote）不适合当门禁，用 version 验证 CLI 可运行；
      # - demo 样例是平台自带的受控包（docs/check-samples），不依赖外网，可在 CI 稳定复现，
      #   用作退出码契约（check 全健康→0、有失败→1）的硬门禁。
      - name: CLI smoke test - version (exit 0)
        run: moon run cmd/moonhealth --target native -- version

      - name: CLI smoke test - check demo_ok (exit 0)
        run: moon run cmd/moonhealth --target native -- check docs/check-samples/demo_ok

      # demo_fail 预期退出码 1（有失败）；捕获并断言，作为退出码契约门禁。
      - name: CLI smoke test - check demo_fail (exit 1)
        shell: bash
        run: |
          set +e
          moon run cmd/moonhealth --target native -- check docs/check-samples/demo_fail >/dev/null 2>&1
          code=$?
          echo "check demo_fail exit=${code}"
          test "${code}" -eq 1
